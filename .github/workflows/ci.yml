name: CI

on:
  push:
    branches: [main, Development]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No `@stable`: rust-toolchain.toml pins the version, so a new stable
      # release cannot turn CI red (via `clippy -D warnings`) on a commit that
      # changed nothing. Bumping the toolchain is its own commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Fast tests (no ffmpeg required)
        run: cargo test

      - name: Full tests (ffmpeg-dependent, --ignored)
        run: cargo test -- --ignored

  # Separate job: a newly published advisory against a dependency is not a
  # reason to fail the build of a commit that did not touch dependencies, but it
  # is something someone has to see.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

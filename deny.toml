# cargo-deny configuration.
#
# The point here is the `advisories` section: nothing in this project currently
# notices when a dependency picks up a published vulnerability or is marked
# unmaintained. The other sections are set to report rather than block, so a
# transitive licence or duplicate-version change does not fail CI on a commit
# that has nothing to do with it.

[advisories]
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0388", # derivative
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0257", # webbrowser, pulled in by eframe 0.27.2's egui-winit; resolved once the egui 0.36 bump lands
]

[licenses]
# The GUI stack (eframe/egui/winit/rfd) pulls in a wide but conventional set of
# permissive licences. Anything outside this list is worth a human look.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.8

# `ort-sys`'s build script downloads ONNX Runtime over TLS, and its HTTP client
# (`ureq`) brings the Mozilla root certificate bundle. The bundle is data under
# a permissive licence that is not in the list above. Allowed for this one crate
# rather than for everyone, so any other crate arriving under it still gets the
# human look the list exists for. Build-time only: the bundle is not linked into
# the VOCAN executable.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
# `windows-sys` alone resolves to six versions through the GUI stack, so
# duplicates are the normal state of this graph, not a signal.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
